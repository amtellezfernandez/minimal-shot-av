[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-shot-av"
version = "0.1.0"
description = "Submission scaffold and baseline simulator for SoTA Commission I"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim-viz = ["Pillow>=10"]
alpasim = ["numpy", "torch"]
qwen-grpo = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "peft>=0.13",
    "pillow>=10",
    "qwen-vl-utils>=0.0.8",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.57",
    "trl>=0.12",
]

[project.entry-points."alpasim.models"]
spotlight_reflex = "minimal_shot_av.alpasim_spotlight:SpotlightReflexAlpaSimModel"

[project.entry-points."alpasim.configs"]
spotlight_reflex = "minimal_shot_av.alpasim_configs"

[project.scripts]
compass = "minimal_shot_av.compass:main"
compass-evidence = "minimal_shot_av.certification:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minimal_shot_av.alpasim_configs" = ["**/*.yaml"]
