[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-shot-av"
version = "0.1.0"
description = "Submission scaffold and baseline simulator for SoTA Commission I"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sim-viz = ["Pillow>=10"]
alpasim = ["numpy", "PyYAML>=6", "pandas>=2", "pyarrow>=16", "scipy>=1.11"]
tuning = ["optuna>=3.6"]

[project.entry-points."alpasim.models"]
spotlight_reflex = "minimal_shot_av.simulator.alpasim_spotlight:SpotlightReflexAlpaSimModel"
token_dagger_bc = "minimal_shot_av.simulator.alpasim_token_bc:TokenBCAlpaSimModel"

[project.entry-points."alpasim.configs"]
spotlight_reflex = "minimal_shot_av.simulator.alpasim_configs"

[project.scripts]
compass = "minimal_shot_av.simulator.compass:main"
compass-evidence = "minimal_shot_av.simulator.certification:main"
alpasim-evidence = "minimal_shot_av.neutral.alpasim_metrics:main"
benchmark-compare = "minimal_shot_av.neutral.benchmark_compare:main"
benchmark-report = "minimal_shot_av.neutral.benchmark_reports:main"
wod-zero-shot-eval = "minimal_shot_av.model.zero_shot_eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minimal_shot_av.simulator.alpasim_configs" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.minimal_shot_av.quality]
max_line_length = 120
forbidden_python310_tokens = [
    "StrEnum",
    "import tomllib",
    "from tomllib import",
    "typing.Self",
    "from typing import Self",
    "Path.walk(",
    "itertools.batched",
]
