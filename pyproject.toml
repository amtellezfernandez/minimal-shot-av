[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-shot-av"
version = "0.1.0"
description = "Submission scaffold and baseline simulator for SoTA Commission I"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim-viz = ["Pillow>=10"]
alpasim = ["numpy", "torch"]

[project.entry-points."alpasim.models"]
spotlight_reflex = "minimal_shot_av.alpasim_spotlight:SpotlightReflexAlpaSimModel"

[project.entry-points."alpasim.configs"]
spotlight_reflex = "minimal_shot_av.alpasim_configs"

[project.scripts]
compass = "minimal_shot_av.compass:main"
compass-evidence = "minimal_shot_av.certification:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minimal_shot_av.alpasim_configs" = ["**/*.yaml"]
