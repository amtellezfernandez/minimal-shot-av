<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <style>
      .title{font:700 34px Helvetica,Arial,sans-serif;fill:#102033}
      .sub{font:400 16px Helvetica,Arial,sans-serif;fill:#526070}
      .box{fill:#fff;stroke:#a9b8ca;stroke-width:2}
      .gen{fill:#ecfeff;stroke:#0891b2}
      .sim{fill:#f0fdf4;stroke:#16a34a}
      .pol{fill:#fff7ed;stroke:#ea580c}
      .met{fill:#eef2ff;stroke:#4f46e5}
      .label{font:700 18px Helvetica,Arial,sans-serif;fill:#132438}
      .txt{font:400 14px Helvetica,Arial,sans-serif;fill:#26384d}
      .small{font:400 12px Helvetica,Arial,sans-serif;fill:#5c6b7d}
      .arrow{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#77869a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7fafc"/>
  <text x="50" y="58" class="title">Custom Simulator: Why It Exists</text>
  <text x="52" y="86" class="sub">It is a controlled stress lab where state, proxy corruption, policy, and metrics are independently manipulable.</text>

  <rect x="70" y="150" width="250" height="150" rx="16" class="gen"/>
  <text x="98" y="183" class="label">Scenario Generator</text>
  <text x="98" y="215" class="txt">11 WOD-style clusters</text>
  <text x="98" y="237" class="txt">LHS stress profiles</text>
  <text x="98" y="259" class="txt">adversarial / hidden / gauntlet</text>
  <text x="98" y="284" class="small">Same seeds across policies</text>

  <rect x="395" y="150" width="250" height="150" rx="16" class="sim"/>
  <text x="423" y="183" class="label">Closed-Loop World</text>
  <text x="423" y="215" class="txt">ego dynamics</text>
  <text x="423" y="237" class="txt">moving actors</text>
  <text x="423" y="259" class="txt">lanes + hazards</text>
  <text x="423" y="284" class="small">True-state evaluation</text>

  <rect x="720" y="150" width="250" height="150" rx="16" class="pol"/>
  <text x="748" y="183" class="label">Policy Under Test</text>
  <text x="748" y="215" class="txt">Spotlight Reflex</text>
  <text x="748" y="237" class="txt">BC / RNN / DAgger</text>
  <text x="748" y="259" class="txt">scorer / clamp / veto</text>
  <text x="748" y="284" class="small">Same token controller</text>

  <rect x="1015" y="150" width="200" height="150" rx="16" class="met"/>
  <text x="1040" y="183" class="label">Metrics</text>
  <text x="1040" y="215" class="txt">pass / PV</text>
  <text x="1040" y="237" class="txt">collision</text>
  <text x="1040" y="259" class="txt">lane / progress</text>
  <text x="1040" y="284" class="small">Per-axis, not one score</text>

  <path d="M320 225 L395 225" class="arrow"/>
  <path d="M645 225 L720 225" class="arrow"/>
  <path d="M970 225 L1015 225" class="arrow"/>
  <path d="M845 300 C850 390 485 390 520 300" class="thin"/>
  <text x="535" y="385" class="small">closed-loop feedback: selected token changes the next state</text>

  <rect x="120" y="435" width="305" height="130" rx="16" class="box"/>
  <text x="148" y="468" class="label">Proxy Perturbations</text>
  <text x="148" y="500" class="txt">heading bias, actor latency</text>
  <text x="148" y="522" class="txt">route offset, lane scale</text>
  <text x="148" y="544" class="txt">feature noise</text>

  <rect x="490" y="435" width="305" height="130" rx="16" class="box"/>
  <text x="518" y="468" class="label">Question It Answers</text>
  <text x="518" y="500" class="txt">Is AlpaSim failure just an adapter bug?</text>
  <text x="518" y="522" class="txt">No: the same tradeoffs appear</text>
  <text x="518" y="544" class="txt">under controlled proxy corruption.</text>

  <rect x="860" y="435" width="305" height="130" rx="16" class="box"/>
  <text x="888" y="468" class="label">Key Output</text>
  <text x="888" y="500" class="txt">288 matched proxy cases</text>
  <text x="888" y="522" class="txt">1440 agent rollouts</text>
  <text x="888" y="544" class="txt">tradeoffs by metric axis</text>
</svg>
